# CORS : autorise le frontend Next.js (autre origine, ex. localhost:3000) à
# appeler l'API. CORS_ALLOW_ORIGIN est une expression régulière (origin_regex),
# jamais `*` (cf. gotcha n° 7). Seuls les en-têtes Content-Type et
# Authorization (JWT) sont acceptés ; max_age met la réponse preflight en cache
# 1 heure côté navigateur.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/':
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            expose_headers: ['Link']
            max_age: 3600
