framework:
    validation:
        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    App\Entity\: []

# En test, la contrainte NotCompromisedPassword (qui interroge l'API
# HaveIBeenPwned) est neutralisée pour éviter tout appel réseau. Aucune
# entité CINAF ne l'utilise actuellement.
when@test:
    framework:
        validation:
            not_compromised_password: false
