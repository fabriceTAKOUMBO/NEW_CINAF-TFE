; ============================================================
; CINAF v2 — réglages PHP du serveur de développement (Symfony CLI).
; Lu automatiquement par `symfony server:start` / `symfony php` ;
; `php bin/console` en direct ne le voit pas (php.ini de WAMP).
; ============================================================

; Xdebug coûte 15 à 25 % par requête (mesuré le 2026-09-16).
; Désactivé par défaut ; pour une session de débogage pas-à-pas,
; remettre `xdebug.mode=develop,debug` puis redémarrer le serveur.
xdebug.mode=off
